# Publica la web fuera del clúster.
# Con balanceador: http://EXTERNAL-IP
# En cada nodo: http://IP-DEL-NODO:30080
apiVersion: v1
kind: Service
metadata:
  name: notas-web
  namespace: actividad-k8s
  labels:
    app: notas-web
spec:
  type: LoadBalancer
  selector:
    app: notas-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
