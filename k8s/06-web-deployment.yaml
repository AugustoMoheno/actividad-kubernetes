# Web, dos réplicas. La actividad pide al menos dos.
# Cambiad USUARIO_DOCKERHUB por el mismo usuario que en la imagen de MariaDB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notas-web
  namespace: actividad-k8s
  labels:
    app: notas-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notas-web
  template:
    metadata:
      labels:
        app: notas-web
    spec:
      initContainers:
        - name: esperar-mariadb
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z notas-db 3306; do echo esperando a MariaDB; sleep 2; done
      containers:
        - name: web
          image: USUARIO_DOCKERHUB/notas-web:1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: notas-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: notas-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: notas-db-secret
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: notas-db-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notas-db-secret
                  key: MYSQL_PASSWORD
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
