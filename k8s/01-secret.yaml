# Usuario, base de datos y contraseñas de MariaDB.
# La web lee estos valores. No hace falta copiarlos al Dockerfile.
# Si los cambiáis, hacedlo antes del primer despliegue. El disco guarda
# la contraseña con la que MariaDB arrancó la primera vez.
apiVersion: v1
kind: Secret
metadata:
  name: notas-db-secret
  namespace: actividad-k8s
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: RootNotas-2026
  MYSQL_DATABASE: notas
  MYSQL_USER: notasapp
  MYSQL_PASSWORD: NotasK8s-2026
